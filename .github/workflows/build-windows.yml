name: Build Windows (fork variants)

# Builds the three desktop flavors from this fork on GitHub-hosted Windows:
#   local  — bundled gateway sidecar only (upstream behavior)
#   mixed  — bundled sidecar + optional remote server (Settings → Gateway)
#   remote — remote server only, no bundled sidecar
#
# Installers are unsigned; Windows SmartScreen shows a one-time "Run anyway".

on:
  push:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.2"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  SKIP_SPAWN_TESTS: "1"

jobs:
  build:
    name: Windows · ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: local
            sidecar: true
            config: src-tauri/tauri.sidecar.conf.json
          - variant: mixed
            sidecar: true
            config: src-tauri/tauri.sidecar.conf.json
          - variant: remote
            sidecar: false
            config: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install root dependencies
        shell: bash
        run: bash scripts/ci-install.sh --ignore-scripts

      - name: Install UI dependencies
        shell: bash
        run: cd ui && bash ../scripts/ci-install.sh --ignore-scripts

      - name: Sync version metadata
        shell: bash
        run: bun run version:sync

      - name: Install Windows browser preview runtime (sidecar variants)
        if: matrix.sidecar
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
        run: bunx playwright install --only-shell chromium

      - name: Build UI (sidecar variants)
        if: matrix.sidecar
        shell: bash
        run: bun run ui:build

      - name: Build gateway sidecar (sidecar variants)
        if: matrix.sidecar
        shell: bash
        env:
          CYBARA_BUILD_COMMIT: ${{ github.sha }}
          CYBARA_SIDECAR_BUN_TARGET: bun-windows-x64
        run: bun run scripts/build-sidecar.ts

      - name: Build Tauri app
        shell: bash
        env:
          CYBARA_DESKTOP_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          args=(--bundles nsis,msi)
          if [ -n "${{ matrix.config }}" ]; then
            args+=(--config "${{ matrix.config }}")
          fi
          bunx tauri build "${args[@]}"

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ matrix.variant }}"
          mkdir -p dist
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "dist/Cybara-${variant}-x64-setup.exe"
          done
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "dist/Cybara-${variant}-x64.msi"
          done
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cybara-windows-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Cybara Desktop (fork) — latest
          body: |
            Unsigned Windows installers built from this fork.

            - `Cybara-local-x64-setup.exe` / `.msi` — bundled gateway only (upstream behavior)
            - `Cybara-mixed-x64-setup.exe` / `.msi` — bundled gateway **and** optional remote server
            - `Cybara-remote-x64-setup.exe` / `.msi` — remote server only

            Configure a remote server with the first-run prompt, `--gateway-url https://...`,
            or the `CYBARA_GATEWAY_URL` environment variable.
          files: dist/*
          overwrite_files: true
        continue-on-error: true
